<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo Clicker 🥟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Top Section: Main Clicking Area -->
        <div class="clicker-section">
            <h1>Momo Clicker</h1>
            <p class="counter"><span id="momo-count">0</span> Momos</p>
            <p class="stats-display">
                <span id="mpc-count">1</span> per click | <span id="mps-count">0</span> per sec
            </p>
            
            <div class="momo-wrapper">
                <div id="main-momo" class="momo">
                    <div class="pleats"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Upgrades Grid -->
        <div class="shop-section">
            <h2>Bhatti Shop (Upgrades)</h2>
            <div id="shop-container" class="shop-grid">
                <!-- Upgrades will be generated dynamically by JavaScript -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
